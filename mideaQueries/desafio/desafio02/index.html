<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario login</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="/styles/mobile.css">
    <link rel="stylesheet" href="/styles/mideaQueries.css">
</head>

<body>
    <main>
        <section id="login">
            <div id="imagem">

            </div>

            <div id="formulario">
                <h1>Login</h1>
                <p>Ben-vindo(a) de volta. Faca login para acessar sua conta e poder fazer configuracoes do ambiente.</p>

                <form action="login.php" method="post" autocomplete="on">
                    <div class="campo">
                        <span class="material-symbols-outlined">person</span>
                        <input type="email" name="email" id="iuser" placeholder="Digite seu email" required
                            autocomplete="email" maxlength="50">
                        <label for="iuser">User</label>
                    </div>

                    <div class="campo">
                        <span class="material-symbols-outlined">vpn_key</span>
                        <input type="password" name="password" id="isenha" placeholder="Digite sua senha" required
                            autocomplete="current-password" minlength="16" maxlength="24">
                        <label for="isenha">Senha</label>
                    </div>
                    <input type="submit" value="Login">

                    <a href="esqueci.html" class="botao">Esqueci a senha
                    <span id="envilope" class="material-symbols-outlined">mail</span></a>

                </form>

            </div>

        </section>

    </main>








</body>

</html>
