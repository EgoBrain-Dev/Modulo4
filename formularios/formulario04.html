<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>

    <form action="cadastro.php" method="post">
        <fieldset>
            <legend>Cadastro do endereco</legend>

            <p>
                <label for="iprov">Provincia</label>
                <select name="provincia" id="iprov">
                    <optgroup label="sul">
                        <option value="" selected>--- Escolha ---</option>
                        <option value="mpt">Maputo Cidade</option>
                        <option value="mptp">Maputo Provincia</option>
                        <option value="gz">Gaza</option>
                    </optgroup>

                    <optgroup label="centro">
                        <option value="sf">Sofala</option>
                        <option value="ch">Chimoio</option>
                        <option value="tt">Tete</option>
                    </optgroup>

                    <optgroup label="norte">
                        <option value="lc">Lichinga</option>
                        <option value="cd">Cabo Delgado</option>
                        <option value="ns">Niassa</option>
                    </optgroup>
                </select>
            </p>

            <p>
                <label for="iprof">Profissao:</label>
                <input type="text" name="profissao" id="iprof" list="lstprof">

                <datalist id="lstprof">
                    <option>Contabilista</option>
                    <option>Programador</option>
                    <option>Desenvolvedor</option>
                </datalist>
            </p>

            <p>
                <label for="imsg">Mensagem</label><br>
                <textarea name="mensagem" id="imsg" placeholder="Deixe sua mensagem" rows="8" cols="40"></textarea>
            </p>
        </fieldset>

        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>
    
</body>
</html>
