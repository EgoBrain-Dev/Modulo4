<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Introducao ao input de cores</h1>

    <form action="cadastro.php" method="post">
        <fieldset>
            <legend>Escolha a sua cor favorita</legend>

            <p>
                <label for="icor">Cor</label>
                <input type="color" name="cor" id="icor">
            </p>

            <p>
                <label for="inivel">Nivel de satisfacao</label>
                <input type="range" name="nivel" id="inivel" min="1"  max="7" value="0">
            </p>

            <p>
                <label for="ifoto">Foto do perfil</label>
                <input type="file" name="foto" id="ifoto" >
            </p>

            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </p>


        </fieldset>
    </form>
    
</body>
</html>
