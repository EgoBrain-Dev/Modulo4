<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario metodo GET</title>
</head>
<body>

    <h1>Introducao a formulario com metodo GET</h1>

    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="user">Usuario:</label>
            <input type="text" name="usu" id="user" required minlength="5" maxlength="16" autocomplete="username">
        </p>

        <p>
            <label for="isenha">Senha:</label>
            <input type="password" name="senh" id="isenha" required minlength="8" maxlength="25" size="25" placeholder="Digite senha com min de 8 letras" autocomplete="current-password">
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
    
</body>
</html>
